<header class="topbar" role="banner">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg><use href="#i-bolt"/></svg></div>
    <div class="brand-text">
      <div class="brand-name">VERDI <span>SAMBO</span></div>
      <div class="brand-sub">Verifikasi kWh Meter · ULP Samboja</div>
    </div>
  </div>
  <div class="top-controls">
    <label class="period" title="Periode verifikasi">
      <span class="sr-only">Bulan</span>
      <select id="sel-month" aria-label="Bulan periode"></select>
      <span class="sr-only">Tahun</span>
      <select id="sel-year" aria-label="Tahun periode"></select>

    <span class="unit-chip" title="Unit layanan"><svg><use href="#i-map"/></svg>ULP Samboja <em>UP3 Balikpapan</em></span>
  </div>
  <div class="lcd-counter" id="lcd-counter" role="status" aria-label="Foto diproses">
    <span class="signal" id="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="lcd-digits"><span class="ghost">888/888</span><span class="on" id="lcd-counter-text">000/000</span></span>
    <span class="lcd-unit">foto</span>
  </div>
  <div class="top-right">
    <span class="engine-pill" id="engine-pill"><span class="dot"></span><span class="txt">Menyiapkan mesin AI…</span></span>
    <span class="clock" id="clock" aria-hidden="true"></span>
    <button class="icon-btn" id="btn-theme" title="Ganti tema (terang/gelap)" aria-label="Ganti tema"><svg><use href="#i-moon"/></svg></button>
    <button class="icon-btn" id="btn-keys" title="Pintasan keyboard (?)" aria-label="Pintasan keyboard"><svg><use href="#i-keys"/></svg></button>
    <button class="icon-btn" id="btn-settings" title="Pengaturan" aria-label="Pengaturan"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="shell" id="shell">
  <nav class="rail" aria-label="Alur kerja">
    <ol class="steps" id="steps"></ol>
    <div class="rail-foot">
      <button class="log-toggle" id="btn-log" aria-expanded="false"><svg><use href="#i-file"/></svg><span>Log proses</span><b id="log-count">0</b></button>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <section class="view" id="view-dash" aria-label="Dasbor"></section>
    <section class="view" id="view-setup" aria-label="Data dan foto" hidden></section>
    <section class="view" id="view-process" aria-label="Proses AI" hidden></section>
    <section class="view" id="view-queue" aria-label="Antrian verifikasi" hidden></section>
    <section class="view" id="view-report" aria-label="Laporan" hidden></section>
    <section class="view" id="view-history" aria-label="Riwayat" hidden></section>
  </main>

  <aside class="inspector" id="inspector" aria-label="Inspektor" hidden></aside>
</div>

<div class="log-drawer" id="log-drawer" hidden>
  <div class="log-head">
    <strong>Log proses</strong>
    <div class="log-tools">
      <select id="log-level" aria-label="Filter level log">
        <option value="">Semua level</option><option value="ok">Berhasil</option><option value="info">Info</option><option value="warn">Peringatan</option><option value="error">Galat</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="log-copy"><svg><use href="#i-copy"/></svg>Salin</button>
      <button class="btn btn-ghost btn-sm" id="log-clear"><svg><use href="#i-trash"/></svg>Kosongkan log</button>
      <button class="icon-btn" id="log-close" aria-label="Tutup log"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>
  <div class="log-body" id="log-body" role="log" aria-live="polite"></div>
</div>

<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="Mode fokus"></div>
<div class="modal-root" id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="in-excel" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="in-folder" webkitdirectory directory multiple hidden>
<input type="file" id="in-photos" accept=".jpg,.jpeg,.png" multiple hidden>
